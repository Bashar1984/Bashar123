<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#F4EBDD;overflow:hidden}svg{display:block}</style></head>
<body>
<svg id="svg" xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
  <pattern id="dotsK" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="9" cy="9" r="4.6" fill="#202020"/></pattern>
  <pattern id="dotsKf" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><circle cx="4" cy="4" r="1.9" fill="#202020"/></pattern>
  <pattern id="dotsY" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(20)"><circle cx="10" cy="10" r="5.5" fill="#F4C542"/></pattern>
  <pattern id="dotsC" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-10)"><circle cx="10" cy="10" r="5.5" fill="#4C9CA8"/></pattern>
  <pattern id="dotsR" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(30)"><circle cx="10" cy="10" r="5" fill="#D83A2E"/></pattern>
  <pattern id="dotsI" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(15)"><circle cx="7" cy="7" r="3" fill="#F4EBDD"/></pattern>
  <pattern id="stripesRI" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)"><rect width="64" height="64" fill="#F4EBDD"/><rect width="30" height="64" fill="#D83A2E"/></pattern>
  <pattern id="win" width="36" height="46" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="16" height="22" fill="#F4EBDD"/></pattern>
  <pattern id="winK" width="36" height="46" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="16" height="22" fill="#202020"/></pattern>
  <pattern id="winY" width="36" height="46" patternUnits="userSpaceOnUse"><rect x="8" y="8" width="16" height="22" fill="#F4C542"/></pattern>
  <linearGradient id="gFade" x1="0" y1="0" x2="1" y2="1"><stop offset=".42" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient>
  <mask id="mFade" maskContentUnits="objectBoundingBox"><rect width="1" height="1" fill="url(#gFade)"/></mask>
  <radialGradient id="warm" cx=".5" cy=".55" r=".75"><stop offset="0" stop-color="#F4C542" stop-opacity=".2"/><stop offset="1" stop-color="#F4C542" stop-opacity="1"/></radialGradient>
  <linearGradient id="dusk" x1="0" y1="0" x2="0" y2="1"><stop offset=".2" stop-color="#F4C542" stop-opacity="0"/><stop offset=".75" stop-color="#F4C542" stop-opacity=".6"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="7" dy="10" stdDeviation="7" flood-color="#202020" flood-opacity=".33"/></filter>
</defs>
<g id="scene"></g>
<image id="grain" x="0" y="0" width="2100" height="1260" style="mix-blend-mode:multiply" opacity=".55"/>
</svg>
<script src="scene.js"></script>
<script>init();</script>
</body></html>
