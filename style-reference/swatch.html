<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#F4EBDD}svg{display:block}</style>
</head><body>
<svg id="s" xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
  <!-- paper grain -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="4" result="n"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.12  0 0 0 0 0.10  0 0 0 0 0.08  0 0 0 0.55 -0.18" />
  </filter>
  <filter id="fibers" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.5" numOctaves="2" seed="9"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.35 -0.12" />
  </filter>
  <!-- torn / rough paper edge -->
  <filter id="torn" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="22" xChannelSelector="R" yChannelSelector="G" result="d"/>
    <feDropShadow dx="7" dy="10" stdDeviation="7" flood-color="#202020" flood-opacity="0.32"/>
  </filter>
  <filter id="torn2" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="7" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="16" xChannelSelector="R" yChannelSelector="G"/>
    <feDropShadow dx="5" dy="8" stdDeviation="5" flood-color="#202020" flood-opacity="0.3"/>
  </filter>
  <filter id="tornMask" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="4" seed="2" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="20" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" seed="3" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    <feDropShadow dx="6" dy="9" stdDeviation="6" flood-color="#202020" flood-opacity="0.35"/>
  </filter>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
    <feDropShadow dx="8" dy="12" stdDeviation="8" flood-color="#202020" flood-opacity="0.35"/>
  </filter>
  <!-- marker ink: slightly wobbly, dry-edged -->
  <filter id="marker" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="5" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="3"/>
  </filter>
  <!-- archival photo texture: duotone mottled emulsion -->
  <filter id="emulsion" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.009 0.016" numOctaves="5" seed="12" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g">
      <feFuncR type="table" tableValues="0.1 0.1 0.35 0.75 0.97"/>
      <feFuncG type="table" tableValues="0.1 0.1 0.33 0.72 0.93"/>
      <feFuncB type="table" tableValues="0.1 0.1 0.30 0.66 0.87"/>
    </feComponentTransfer>
  </filter>
  <filter id="emulsion2" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="turbulence" baseFrequency="0.008 0.03" numOctaves="4" seed="31" result="n"/>
    <feColorMatrix in="n" type="saturate" values="0" result="g"/>
    <feComponentTransfer in="g">
      <feFuncR type="table" tableValues="0.13 0.18 0.3 0.7 0.96"/>
      <feFuncG type="table" tableValues="0.13 0.3 0.61 0.82 0.92"/>
      <feFuncB type="table" tableValues="0.13 0.33 0.66 0.84 0.87"/>
    </feComponentTransfer>
  </filter>
  <pattern id="stripesCyan" width="56" height="56" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
    <rect width="56" height="56" fill="#202020"/><rect width="26" height="56" fill="#4C9CA8"/>
  </pattern>
  <pattern id="stripesRed" width="40" height="40" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="40" height="40" fill="#F4EBDD"/><rect width="16" height="40" fill="#D83A2E"/>
  </pattern>
  <pattern id="dotsDark" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(15)">
    <circle cx="11" cy="11" r="5.5" fill="#202020"/>
  </pattern>
  <pattern id="dotsPhoto" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <circle cx="4.5" cy="4.5" r="2.2" fill="#202020" opacity="0.45"/>
  </pattern>
  <clipPath id="photo1"><rect x="0" y="0" width="420" height="540"/></clipPath>
  <clipPath id="photo2"><rect x="0" y="0" width="360" height="300"/></clipPath>
</defs>

<!-- base paper -->
<rect width="1080" height="1920" fill="#F4EBDD"/>

<!-- big burnt red circle -->
<g filter="url(#rough)"><circle cx="700" cy="470" r="380" fill="#D83A2E"/></g>
<!-- halftone gradient over circle (generated) -->
<g id="htCircle"></g>

<!-- charcoal torn block with cyan diagonal stripes -->
<mask id="mStripes" maskUnits="userSpaceOnUse" x="-100" y="800" width="1300" height="1300">
  <g filter="url(#tornMask)"><polygon points="-40,1180 1120,960 1120,1980 -40,1980" fill="#fff"/></g>
</mask>
<g filter="url(#shadow)"><rect x="-40" y="900" width="1180" height="1100" fill="url(#stripesCyan)" mask="url(#mStripes)"/></g>

<!-- mustard torn paper diagonal band -->
<g filter="url(#torn)">
  <polygon points="-60,860 1140,640 1140,900 -60,1150" fill="#F4C542"/>
</g>
<g id="htBand"></g>

<!-- ivory torn scrap with red stripes -->
<mask id="mRed" maskUnits="userSpaceOnUse" x="0" y="1300" width="700" height="500">
  <g filter="url(#tornMask)" transform="translate(70 1420) rotate(-8)"><polygon points="0,0 430,-20 460,250 20,280" fill="#fff"/></g>
</mask>
<g filter="url(#shadow)"><rect x="0" y="1300" width="700" height="500" fill="url(#stripesRed)" mask="url(#mRed)"/></g>

<!-- archival photo cutout 1 (abstract, grainy duotone) -->
<g transform="translate(90 230) rotate(-6)" filter="url(#shadow)">
  <rect x="-28" y="-28" width="476" height="596" fill="#FBF7EF"/>
  <g clip-path="url(#photo1)">
    <rect width="420" height="540" filter="url(#emulsion)"/>
    <rect width="420" height="540" fill="url(#dotsPhoto)"/>
    <rect width="420" height="540" fill="#7a5a3a" opacity="0.18" style="mix-blend-mode:multiply"/>
  </g>
</g>

<!-- archival photo cutout 2 (cyan-toned) -->
<g transform="translate(600 1250) rotate(5)" filter="url(#shadow)">
  <rect x="-24" y="-24" width="408" height="348" fill="#FBF7EF"/>
  <g clip-path="url(#photo2)">
    <rect width="360" height="300" filter="url(#emulsion2)"/>
    <rect width="360" height="300" fill="url(#dotsPhoto)"/>
  </g>
</g>

<!-- small mustard circle + charcoal circle -->
<g filter="url(#rough)"><circle cx="880" cy="1060" r="120" fill="#202020"/></g>
<g filter="url(#rough)"><circle cx="905" cy="1085" r="70" fill="#F4C542"/></g>
<g filter="url(#rough)"><circle cx="210" cy="1720" r="95" fill="#4C9CA8"/></g>
<circle cx="210" cy="1720" r="95" fill="url(#dotsDark)" opacity="0.5"/>

<!-- cyan torn strip (tape-like) across photo 1 -->
<g filter="url(#torn2)" transform="translate(320 200) rotate(28)">
  <rect width="240" height="64" fill="#4C9CA8" opacity="0.92"/>
</g>
<!-- ivory tape on photo 2 -->
<g filter="url(#torn2)" transform="translate(860 1220) rotate(-30)">
  <rect width="170" height="54" fill="#F4EBDD" opacity="0.9"/>
</g>

<!-- halftone dot patch (charcoal on ivory) -->
<g transform="translate(650 1640)"><g id="htPatch"></g></g>

<!-- marker annotations (no letters) -->
<g filter="url(#marker)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <!-- loose circle around photo cutout -->
  <path d="M110,190 C300,120 560,170 580,420 C600,690 380,820 200,780 C40,740 20,520 60,360 C80,280 130,220 220,200"
        stroke="#D83A2E" stroke-width="9"/>
  <!-- arrow from circle to photo 2 -->
  <path d="M470,1000 C440,1100 470,1190 560,1250" stroke="#F4EBDD" stroke-width="9"/>
  <path d="M515,1262 L566,1254 L548,1208" stroke="#F4EBDD" stroke-width="9"/>
  <!-- double underline scribble -->
  <path d="M120,1320 C220,1300 330,1335 450,1305" stroke="#F4EBDD" stroke-width="8"/>
  <path d="M140,1345 C250,1330 340,1360 430,1338" stroke="#F4EBDD" stroke-width="6"/>
  <!-- cross ticks -->
  <path d="M940,180 l40,40 M980,180 l-40,40" stroke="#202020" stroke-width="8"/>
  <path d="M960,1830 l36,30 M996,1830 l-36,30" stroke="#D83A2E" stroke-width="8"/>
  <!-- zigzag energy mark -->
  <path d="M760,860 l30,-30 l20,40 l30,-40 l20,40 l30,-40" stroke="#202020" stroke-width="7"/>
  <!-- bracket -->
  <path d="M1010,1300 c25,0 25,30 25,60 l0,90 c0,30 0,50 -25,55" stroke="#F4C542" stroke-width="8"/>
  <!-- ink brush stroke -->
  <path d="M70,1100 C200,1060 330,1080 430,1040" stroke="#202020" stroke-width="18" opacity="0.92"/>
</g>

<!-- grain overlays -->
<rect width="1080" height="1920" filter="url(#fibers)" style="mix-blend-mode:multiply"/>
<rect width="1080" height="1920" filter="url(#grain)" style="mix-blend-mode:multiply"/>
</svg>
<script>
const NS="http://www.w3.org/2000/svg";
function halftone(g,{x0,y0,w,h,step,maxR,color,angle,fn,clip}){
  const el=document.getElementById(g);
  const grp=document.createElementNS(NS,"g");
  grp.setAttribute("transform",`rotate(${angle} ${x0+w/2} ${y0+h/2})`);
  for(let y=y0;y<y0+h;y+=step)for(let x=x0;x<x0+w;x+=step){
    if(clip&&!clip(x,y))continue;
    const r=maxR*fn(x,y); if(r<0.6)continue;
    const c=document.createElementNS(NS,"circle");
    c.setAttribute("cx",x);c.setAttribute("cy",y);c.setAttribute("r",r.toFixed(2));c.setAttribute("fill",color);
    grp.appendChild(c);}
  el.appendChild(grp);
}
// circle: dark halftone fading from lower-right edge
halftone("htCircle",{x0:320,y0:90,w:760,h:760,step:20,maxR:8,color:"#202020",angle:20,
  fn:(x,y)=>Math.max(0,Math.min(1,((x-560)+(y-380))/520)),
  clip:(x,y)=>Math.hypot(x-700,y-470)<365});
// mustard band: red dots fading to the left
halftone("htBand",{x0:-40,y0:640,w:1160,h:520,step:24,maxR:9,color:"#D83A2E",angle:-10,
  fn:(x,y)=>Math.max(0,Math.min(1,(x-350)/700)),
  clip:(x,y)=>{const top=860-(x+60)*(220/1200)+20, bot=1150-(x+60)*(250/1200)-25; return y>top&&y<bot;}});
// patch: radial halftone
halftone("htPatch",{x0:0,y0:0,w:330,h:230,step:16,maxR:7,color:"#202020",angle:0,
  fn:(x,y)=>Math.max(0,1-Math.hypot(x-60,y-200)/360)});
</script>
</body></html>
